<!DOCTYPE html>
<html id="alldahtml" lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="title">Five Nights at Ezequiel's</title>
  <link rel="stylesheet" type="text/css" href="feed.css" />
  <link rel="stylesheet" type="text/css" media="screen and (max-width: 1920px)" href="1080.css" />
  <link rel="stylesheet" type="text/css" media="screen and (max-width: 640px)" href="640.css" />
</head>

<body id="mainbody">
  <!-- Start Overlay for audio unlock and immersive experience -->
  <div id="startoverlay">
    <h1>FIVE NIGHTS AT EZEQUIEL'S</h1>
    <p class="subtitle">EDICIÓN PERSONALIZADA</p>
    <div class="start-btn">[ HAZ CLIC PARA JUGAR ]</div>
    <p class="hint">Sonido, estática y jumpscares listos</p>
  </div>

  <video id="gameoverstaticimg" src="graphics/camera/static_test5.webm" loop muted preload="auto"></video>
  <div id="amduatlogo"></div>
  <img id="transistionanimation" src="graphics/transition/0.webp" alt="" />

  <div id="nightover">
    <img id="nightoverbg" src="graphics/nightover.png" alt="" />
    <img id="nightover5" src="graphics/camera/ui/time5.png" alt="5" />
    <img id="nightover6" src="graphics/camera/ui/time6.png" alt="6" />
    <img id="nightoveram" src="graphics/camera/ui/timeAM.png" alt="AM" />
  </div>

  <div id="gameover">
    <img class="fullscreen-img" src="graphics/gameover/gameoverimg.webp" alt="Game Over" />
    <img class="gameover-label" src="graphics/gameover/gameover.png" alt="GAME OVER" />
  </div>

  <div id="newgamebg">
    <img class="fullscreen-img" src="graphics/newgame.webp" alt="Help Wanted" />
  </div>

  <div id="mainmenu">
    <img id="achievement1" src="graphics/mainmenu/star.png" alt="Star 1" />
    <img id="achievement2" src="graphics/mainmenu/star.png" alt="Star 2" />
    <img id="achievement3" src="graphics/mainmenu/star.png" alt="Star 3" />
    <img id="menu-logo" src="graphics/fnaflogo.png" alt="Five Nights at Ezequiel's" />
    <div class="menu-copyright">© 2026 Ezequiel Edition</div>

    <img id="newbutton" src="graphics/mainmenu/newgame.png" alt="New Game" />
    <img id="continuebutton" src="graphics/mainmenu/continue.png" alt="Continue" />
    <img id="continuebuttonnight" src="graphics/mainmenu/littletext/night.png" alt="Night" />
    <img id="continuebuttonnightnumber" src="graphics/mainmenu/littletext/2.png" alt="" />
    <img id="6thnight" src="graphics/mainmenu/6thnight.png" alt="6th Night" />
    <img id="customnight" src="graphics/mainmenu/customnight.png" alt="Custom Night" />
    <img id="selectedarrows" src="graphics/mainmenu/selected.png" alt=">" />

    <img id="mainmenufazbearanim" src="graphics/mainmenu/0.webp" alt="" />
    <video id="mainmenustaticimg" src="graphics/camera/static_test5.webm" autoplay loop muted preload="auto"></video>
  </div>

  <div id="night7interface">
    <img id="customnighttitle" src="graphics/mainmenu/customnight/text/title.png" alt="Customize Night" />
    <div id="customnight-grid"></div>
    <button id="customnight-back" type="button">VOLVER</button>
    <img id="ready" src="graphics/mainmenu/customnight/text/ready.png" alt="Ready" />
    <img id="difficultyhelp" src="graphics/mainmenu/customnight/text/difficulty.png" alt="Difficulty Info" />
  </div>

  <div id="body">
    <img id="camerafeedanimation" src="graphics/camera/camerafeedanimation/0.webp" alt="" />

    <div id="camerafeed" class="main">
      <img id="room" class="roomtest" src="graphics/rooms/1a/0.webp" alt="Camera Feed" />
      <img id="record" src="graphics/camera/record.png" alt="REC" />
      <div id="static" class="static">
        <video id="staticimg" src="graphics/camera/static_test5.webm" autoplay loop muted preload="auto"></video>
      </div>
      <div id="camera" class="camera"></div>
      <img id="cameradisabled" src="graphics/camera/ui/cameradisabled.png" alt="Camera Disabled" />
      <img id="outline" src="graphics/camera/outline.png" alt="" />
      <div id="map" class="map">
        <img id="mapimg" src="graphics/camera/map.png" alt="Map" />
        <img id="roomname" src="graphics/camera/roomnames/1a.webp" alt="Room Name" />
        <a id="button-1a"><img id="1a" src="graphics/camera/mapbuttons/1a.png" alt="1A" /></a>
        <a id="button-1b"><img id="1b" src="graphics/camera/mapbuttons/1b.png" alt="1B" /></a>
        <a id="button-1c"><img id="1c" src="graphics/camera/mapbuttons/1c.png" alt="1C" /></a>
        <a id="button-2a"><img id="2a" src="graphics/camera/mapbuttons/2a.png" alt="2A" /></a>
        <a id="button-2b"><img id="2b" src="graphics/camera/mapbuttons/2b.png" alt="2B" /></a>
        <a id="button-5"><img id="5" src="graphics/camera/mapbuttons/5.png" alt="5" /></a>
        <a id="button-7"><img id="7" src="graphics/camera/mapbuttons/7.png" alt="7" /></a>
        <a id="button-3"><img id="3" src="graphics/camera/mapbuttons/3.png" alt="3" /></a>
        <a id="button-4a"><img id="4a" src="graphics/camera/mapbuttons/4a.png" alt="4A" /></a>
        <a id="button-4b"><img id="4b" src="graphics/camera/mapbuttons/4b.png" alt="4B" /></a>
        <a id="button-6"><img id="6" src="graphics/camera/mapbuttons/6.png" alt="6" /></a>
      </div>
    </div>

    <div id="office">
      <div id="officemain">
        <div id="doorbuttonsleft">
          <img id="doorbuttonsleft_door" src="graphics/rooms/office/cameraposition.webp" alt="Left Door" />
          <img id="doorbuttonsleft_light" src="graphics/rooms/office/cameraposition.webp" alt="Left Light" />
        </div>
        <div id="doorbuttonsright">
          <img id="doorbuttonsright_door" src="graphics/rooms/office/cameraposition.webp" alt="Right Door" />
          <img id="doorbuttonsright_light" src="graphics/rooms/office/cameraposition.webp" alt="Right Light" />
        </div>
        <img id="goldenfreddy-overlay" src="graphics/mainmenu/3.webp" alt="" />
      </div>
      <img id="fan" src="graphics/rooms/office/fan_1.webp" alt="Fan" />
      <img id="doorleft" src="graphics/rooms/office/doors/left/0.webp" alt="" />
      <img id="doorright" src="graphics/rooms/office/doors/right/0.webp" alt="" />
    </div>
  </div>

  <img id="officecameraright" src="graphics/rooms/office/cameraposition.webp" alt="" />
  <img id="officecameraleft" src="graphics/rooms/office/cameraposition.webp" alt="" />
  <img id="openclosecamera" src="graphics/camera/openclosecamera.png" alt="Toggle Camera" />

  <div id="timekeeper">
    <img id="timehour" src="graphics/camera/ui/time1.png" alt="" />
    <img id="timehourextra" src="graphics/camera/ui/time2.png" alt="" />
    <img id="timeAM" src="graphics/camera/ui/timeAM.png" alt="AM" />
    <img id="timenight" src="graphics/camera/ui/night.png" alt="Night" />
    <img id="timenightnumber" src="graphics/camera/ui/1.png" alt="1" />
  </div>

  <div id="power">
    <img id="powerleft" src="graphics/camera/powerleft.png" alt="Power Left" />
    <img id="numberone" src="graphics/camera/ui/powernumbers/1.png" alt="" />
    <img id="numbertwo" src="graphics/camera/ui/powernumbers/0.png" alt="" />
    <img id="numberthree" src="graphics/camera/ui/powernumbers/0.png" alt="" />
    <img id="numberpercent" src="graphics/camera/ui/powernumbers/percent.png" alt="%" />
    <br /><br />
    <img id="powerword" src="graphics/camera/powerusage.png" alt="Usage" />
    <img id="powerusage" src="graphics/camera/power1.png" alt="Usage Level" />
  </div>

  <img id="loadingicon" src="graphics/loadingicon.png" alt="Loading..." />

  <script src="script/SeamlessLoop.js" type="text/javascript"></script>
  <script type="module" src="script/app.js"></script>
</body>
</html>
